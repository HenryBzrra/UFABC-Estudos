.sb{position:sticky;top:12px;display:flex;flex-direction:column;gap:6px;padding:8px;width:60px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:width 420ms cubic-bezier(.22,1,.36,1)}
.sb.open{width:200px}
.si{width:100%;justify-content:flex-start;gap:12px;padding:10px;white-space:nowrap;border-radius:999px}
.si .ic{font-size:18px;line-height:1;font-style:normal}.si .lb{opacity:0;transition:opacity 300ms ease}.sb.open .lb{opacity:1}
.si.tg{color:var(--tx2);font-size:18px}
@media(max-width:600px){.layout{flex-direction:column}.sb{position:static;flex-direction:row;width:100%!important;justify-content:space-between}.si{width:auto}.sb .lb,.si.tg{display:none}}
.av{width:96px;height:96px;border-radius:50%;padding:0;border:2px solid rgba(95,134,168,.7);overflow:hidden;background:var(--el);color:var(--tx);cursor:pointer;display:grid;place-items:center;font:900 italic 34px Figtree,system-ui,sans-serif;transition:var(--ease)}
.av:hover{border-color:#ADC5D8;box-shadow:0 0 24px rgba(95,134,168,.3)}.av img{width:100%;height:100%;object-fit:cover}
.prof{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.nm{display:flex;align-items:center;gap:8px}.nm h3{margin:0}.ip{padding:6px 10px;opacity:.75}
.ni{font:900 italic 20px Figtree,system-ui,sans-serif;color:var(--tx);background:rgba(8,18,28,.6);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;text-align:center;max-width:100%}
#vid,#pv{display:block;max-width:100%;border-radius:14px;margin:12px 0}#vid[hidden],#pv[hidden]{display:none}

.pill{color:#E98BA3;border-color:rgba(197,3,55,.4)}
.panel{background:rgba(14,8,15,.6)}
.ex{background:rgba(18,9,17,.55)}

select{background:rgba(14,8,15,.9)}
.dot.on{background:linear-gradient(115deg,#8A0A30,#C50337);box-shadow:0 0 12px rgba(197,3,55,.5)}
.nt textarea{background:rgba(2,6,14,.6)}

.ripple{background:radial-gradient(circle,transparent 52%,rgba(255,215,224,.22) 60%,transparent 68%)}
.sheen{background:linear-gradient(105deg,transparent 25%,rgba(173,205,235,.2) 38%,rgba(255,255,255,.34) 50%,rgba(225,170,205,.24) 62%,transparent 75%)}
.btn.qd.sel{background:linear-gradient(115deg,rgba(138,10,48,.95),rgba(197,3,55,.92))}

<script>
const TABS=[["FEMEC"],["GEOANALITICA"],["FUNVARIAVEL"]];
const f=n=>String(+Number(n).toFixed(3)).replace(".",","),p=n=>n<0?"("+f(n)+")":f(n);
const sg=(n,s="x")=>n===1?s:n===-1?"−"+s:f(n)+s;
const T=[
{t:0,n:"Momento Linear",r:"O momento linear de uma partícula é p = m·v (vetor). Unidade SI: kg·m/s. A segunda lei de Newton escreve-se F = dp/dt, e o impulso I = ∫F dt = Δp.",
g:R=>{const m=R(2,9),v=R(3,20);return{q:`Uma partícula de massa ${m} kg move-se com velocidade de ${v} m/s. Calcule o módulo do seu momento linear.`,s:[["p = m·v","O momento linear é o produto da massa pela velocidade."],[`p = ${m}·${v}`,"Substituímos os dados em unidades do SI."],[`p = ${m*v} kg·m/s`,"Multiplicamos; a unidade resulta de kg·(m/s)."]],a:`p = ${m*v} kg·m/s`}}},
{t:0,n:"Centro de Massa",r:"Para um sistema discreto, r_cm = (Σ mᵢ·rᵢ) / (Σ mᵢ). Em uma dimensão: x_cm = (m₁x₁ + m₂x₂)/(m₁ + m₂). O CM move-se como se toda a massa e as forças externas estivessem concentradas nele.",
g:R=>{const a=R(1,6),b=R(2,8),x=R(0,3),y=R(4,12),n=a*x+b*y,d=a+b;return{q:`Duas partículas: ${a} kg em x = ${x} m e ${b} kg em x = ${y} m. Determine a posição do centro de massa.`,s:[["x_cm = (m₁x₁ + m₂x₂)/(m₁ + m₂)","Média das posições ponderada pelas massas."],[`x_cm = (${a}·${x} + ${b}·${y})/(${a} + ${b})`,"Substituímos massas e posições."],[`x_cm = ${n}/${d}`,"Calculamos numerador e denominador."],[`x_cm ≈ ${f(n/d)} m`,"O CM fica mais perto da partícula mais pesada."]],a:`x_cm ≈ ${f(n/d)} m`}}},
{t:0,n:"Colisão entre partículas",r:"Em colisões o momento total se conserva. Elástica: conserva também a energia cinética. Perfeitamente inelástica: os corpos seguem juntos, com v = (m₁v₁ + m₂v₂)/(m₁ + m₂), e há perda máxima de energia cinética.",
g:R=>{const a=R(1,5),v=R(4,12),b=R(1,5),vf=a*v/(a+b),k0=a*v*v/2,k1=(a+b)*vf*vf/2;return{q:`Um carrinho de ${a} kg a ${v} m/s colide com outro de ${b} kg parado e ambos seguem juntos (colisão perfeitamente inelástica). Calcule a velocidade final e a energia cinética dissipada.`,s:[["m₁v₁ = (m₁ + m₂)·v′","Sem forças externas horizontais, o momento se conserva."],[`${a}·${v} = ${a+b}·v′`,"Substituímos os valores; o segundo carrinho tem v = 0."],[`v′ = ${f(a*v)}/${a+b} ≈ ${f(vf)} m/s`,"Isolamos a velocidade final."],[`ΔK = ${f(k1)} − ${f(k0)} = ${f(k1-k0)} J`,"Comparamos K final e inicial: K = ½mv²."]],a:`v′ ≈ ${f(vf)} m/s; energia dissipada ≈ ${f(k0-k1)} J`}}},
{t:0,n:"Conservação do momento Linear",r:"Se a força externa resultante sobre um sistema é nula, o momento linear total permanece constante: Σ pᵢ (antes) = Σ pᵢ (depois). É válida em explosões, recuos e colisões.",
g:R=>{const a=R(2,6),b=R(8,20),v=R(2,9),w=a*v/b;return{q:`Um bloco de ${a+b} kg, inicialmente em repouso, explode em dois fragmentos: um de ${a} kg e outro de ${b} kg. O fragmento de ${a} kg sai a ${v} m/s. Determine a velocidade do outro fragmento.`,s:[["p_antes = p_depois = 0","O sistema parte do repouso: momento total nulo."],[`0 = ${a}·${v} + ${b}·v₂`,"Escolhemos o sentido do primeiro fragmento como positivo."],[`v₂ = −${a*v}/${b}`,"Isolamos v₂."],[`v₂ ≈ −${f(w)} m/s`,"O sinal negativo indica sentido oposto."]],a:`v₂ ≈ ${f(w)} m/s, em sentido oposto`}}},
{t:1,n:"Vetores",r:"Um vetor em ℝ³ é u = (x, y, z). Soma e multiplicação por escalar operam coordenada a coordenada. O módulo é |u| = √(x² + y² + z²).",
g:R=>{const u=[R(-4,5),R(-4,5),R(-3,6)],v=[R(-4,5),R(-4,5),R(-3,6)],w=u.map((c,i)=>2*c-v[i]),m=w.reduce((s,c)=>s+c*c,0);return{q:`Dados u = (${u}) e v = (${v}), calcule o módulo de 2u − v.`,s:[["2u − v = (2x₁ − x₂, 2y₁ − y₂, 2z₁ − z₂)","Operações com vetores são feitas coordenada a coordenada."],[`2u − v = (${w.join(", ")})`,"Efetuamos as contas em cada componente."],[`|w| = √(${w.map(c=>p(c)+"²").join(" + ")})`,"Aplicamos a fórmula do módulo."],[`|w| = √${m} ≈ ${f(Math.sqrt(m))}`,"Somamos os quadrados e extraímos a raiz."]],a:`|2u − v| = √${m} ≈ ${f(Math.sqrt(m))}`}}},
{t:1,n:"Dependência Linear e Bases",r:"Dois vetores de ℝ² são LI se, e somente se, det[u v] ≠ 0; então formam uma base de ℝ². Se det = 0, um é múltiplo do outro (LD).",
g:R=>{const a=R(1,5),b=R(1,5),ld=R(0,1),t=R(2,3),c=ld?t*a:R(-4,6),d=ld?t*b:R(-4,6),D=a*d-b*c,L=D===0;return{q:`Os vetores u = (${a}, ${b}) e v = (${c}, ${d}) formam uma base de ℝ²? Justifique.`,s:[["det = x₁·y₂ − y₁·x₂","O determinante das coordenadas decide a independência linear."],[`det = ${a}·${p(d)} − ${b}·${p(c)}`,"Substituímos as coordenadas."],[`det = ${D}`,"Calculamos."],[L?"det = 0 ⇒ LD, não é base":"det ≠ 0 ⇒ LI, é base",L?"Um vetor é múltiplo do outro.":"Dois vetores LI geram ℝ², que tem dimensão 2."]],a:L?"Não: são LD.":"Sim: são LI e formam uma base."}}},
{t:1,n:"Produto Escalar",r:"u·v = x₁x₂ + y₁y₂ + z₁z₂ = |u||v|cos θ. Se u·v = 0, os vetores são ortogonais. Logo, cos θ = u·v/(|u||v|).",
g:R=>{const u=[R(1,5),R(-3,4),R(0,4)],v=[R(-2,5),R(1,5),R(-3,3)],d=u[0]*v[0]+u[1]*v[1]+u[2]*v[2],A=u.reduce((s,c)=>s+c*c,0),B=v.reduce((s,c)=>s+c*c,0),c=d/Math.sqrt(A*B),th=Math.acos(c)*180/Math.PI;return{q:`Calcule u·v e o ângulo entre u = (${u}) e v = (${v}).`,s:[["u·v = x₁x₂ + y₁y₂ + z₁z₂","Soma dos produtos das coordenadas correspondentes."],[`u·v = ${u.map((c,i)=>c+"·"+p(v[i])).join(" + ")} = ${d}`,"Substituímos e somamos."],[`|u| = √${A},  |v| = √${B}`,"Calculamos os módulos."],[`cos θ = ${d}/√${A*B} ≈ ${f(c)}`,"Da definição geométrica do produto escalar."],[`θ ≈ ${f(th)}°`,"Aplicamos arccos."]],a:`u·v = ${d}; θ ≈ ${f(th)}°`}}},
{t:1,n:"Produto Vetorial e Produto Misto",r:"u × v = (y₁z₂ − z₁y₂, z₁x₂ − x₁z₂, x₁y₂ − y₁x₂) é ortogonal a u e v; |u × v| é a área do paralelogramo. O produto misto [u,v,w] = (u × v)·w dá o volume do paralelepípedo (em módulo).",
g:R=>{const[a,b,c]=[R(-3,4),R(-3,4),R(1,4)],[d,e,g]=[R(-3,4),R(1,4),R(-3,4)],x=b*g-c*e,y=c*d-a*g,z=a*e-b*d,m=x*x+y*y+z*z;return{q:`Dados u = (${a}, ${b}, ${c}) e v = (${d}, ${e}, ${g}), determine u × v e a área do paralelogramo definido por eles.`,s:[["u × v = (bg − ce, cd − ag, ae − bd)","Desenvolvimento do determinante simbólico por cofatores."],[`x = ${b}·${p(g)} − ${c}·${p(e)} = ${x}`,"Primeira componente."],[`y = ${c}·${p(d)} − ${p(a)}·${p(g)} = ${y};  z = ${p(a)}·${p(e)} − ${p(b)}·${p(d)} = ${z}`,"Segunda e terceira componentes."],[`Área = |u × v| = √${m} ≈ ${f(Math.sqrt(m))}`,"A norma do produto vetorial é a área do paralelogramo."]],a:`u × v = (${x}, ${y}, ${z}); área ≈ ${f(Math.sqrt(m))}`}}},
{t:1,n:"Estudo da reta",r:"A reta por A com direção d = B − A tem equações paramétricas x = x₀ + at, y = y₀ + bt, z = z₀ + ct, e simétricas (x − x₀)/a = (y − y₀)/b = (z − z₀)/c (quando a, b, c ≠ 0).",
g:R=>{const A=[R(-3,4),R(-3,4),R(-2,5)],d=[R(1,4),R(-3,-1),R(1,5)],B=A.map((c,i)=>c+d[i]);return{q:`Determine as equações paramétricas da reta que passa por A = (${A}) e B = (${B}).`,s:[["d = B − A","O vetor diretor é dado pela diferença dos pontos."],[`d = (${d})`,"Calculamos coordenada a coordenada."],[`x = ${A[0]} + ${p(d[0])}t,  y = ${A[1]} + ${p(d[1])}t,  z = ${A[2]} + ${p(d[2])}t`,"Ponto A mais t vezes a direção d, com t ∈ ℝ."]],a:`(x, y, z) = (${A}) + t(${d}), t ∈ ℝ`}}},
{t:1,n:"Estudo do plano",r:"O plano que passa por P₀ com normal n = (a, b, c) tem equação geral ax + by + cz = d, onde d = n·P₀. Dois planos são paralelos se suas normais são múltiplas.",
g:R=>{const n=[R(1,4),R(-3,3),R(1,5)],P=[R(-2,4),R(-2,4),R(-2,4)],d=n[0]*P[0]+n[1]*P[1]+n[2]*P[2];return{q:`Encontre a equação geral do plano que passa por P = (${P}) e tem vetor normal n = (${n}).`,s:[["ax + by + cz = d, com d = n·P","Todo ponto X do plano satisfaz n·(X − P) = 0."],[`${sg(n[0])} + ${p(n[1])}y + ${n[2]}z = d`.replace(/^(\d*)x/,"$1x"),"Os coeficientes são as coordenadas da normal."],[`d = ${n[0]}·${p(P[0])} + ${p(n[1])}·${p(P[1])} + ${n[2]}·${p(P[2])} = ${d}`,"Substituímos o ponto dado para achar d."]],a:`${n[0]}x + ${p(n[1])}y + ${n[2]}z = ${d}`}}},
{t:1,n:"Cônicas",r:"Elipse com centro na origem e eixo maior em x: x²/a² + y²/b² = 1, com c² = a² − b², focos (±c, 0) e excentricidade e = c/a < 1.",
g:R=>{const[a,b,c]=R.p([[5,3,4],[10,6,8],[13,5,12],[17,8,15],[25,7,24],[15,9,12]]);return{q:`Considere a elipse x²/${a*a} + y²/${b*b} = 1. Determine os focos e a excentricidade.`,s:[[`a² = ${a*a},  b² = ${b*b}`,"O maior denominador é a² (eixo maior ao longo de x)."],[`c² = a² − b² = ${a*a} − ${b*b} = ${c*c}`,"Relação fundamental da elipse."],[`c = ${c}  ⇒  F₁ = (−${c}, 0),  F₂ = (${c}, 0)`,"Os focos estão sobre o eixo maior."],[`e = c/a = ${c}/${a} ≈ ${f(c/a)}`,"A excentricidade mede o achatamento."]],a:`Focos (±${c}, 0); e = ${c}/${a}`}}},
{t:2,n:"Integral por partes",r:"∫u dv = u·v − ∫v du. Escolha u de modo que du simplifique (regra LIATE) e dv de modo que v seja fácil de obter.",
g:R=>{const k=R(2,5);return{q:`Calcule ∫ x·e^(${k}x) dx.`,s:[[`u = x,  dv = e^(${k}x) dx`,"Polinômio vira constante ao derivar; a exponencial é fácil de integrar."],[`du = dx,  v = e^(${k}x)/${k}`,"Derivamos u e integramos dv."],[`∫ = x·e^(${k}x)/${k} − (1/${k})∫ e^(${k}x) dx`,"Aplicamos ∫u dv = uv − ∫v du."],[`∫ = e^(${k}x)·(x/${k} − 1/${k*k}) + C`,"Resolvemos a integral restante e colocamos em evidência."]],a:`e^(${k}x)·(x/${k} − 1/${k*k}) + C`}}},
{t:2,n:"Integral definida por mudança de variáveis",r:"Se u = g(x), então ∫ₐᵇ f(g(x))·g′(x) dx = ∫_{g(a)}^{g(b)} f(u) du. Ao mudar a variável, os limites de integração também mudam.",
g:R=>{const a=R(1,3),n=R(2,4),k=R(1,4),A=Math.pow(1+a,n+1),B=Math.pow(a,n+1),v=k*(A-B)/(2*(n+1));return{q:`Calcule ∫₀¹ ${k===1?"":k}x·(x² + ${a})^${n} dx.`,s:[[`u = x² + ${a},  du = 2x dx`,"A derivada de x² + a aparece (a menos de constante) no integrando."],[`x = 0 ⇒ u = ${a};  x = 1 ⇒ u = ${1+a}`,"Convertemos os limites para a nova variável."],[`∫ = (${k}/2)·∫_${a}^${1+a} u^${n} du`,"x dx = du/2."],[`∫ = (${k}/2)·[u^${n+1}/${n+1}]_${a}^${1+a} = ${k}·(${A} − ${B})/${2*(n+1)}`,"Antiderivada e avaliação nos novos limites."],[`∫ ≈ ${f(v)}`,"Valor numérico."]],a:`≈ ${f(v)}`}}},
{t:2,n:"Integral de funções racionais com polinômios",r:"Para ∫P(x)/Q(x) dx com grau P < grau Q, decompomos em frações parciais. Fatores lineares distintos geram termos A/(x − a). Se grau P ≥ grau Q, faça antes a divisão polinomial.",
g:R=>{const a=R(2,6),b=R(-4,1),D=a-b;return{q:`Calcule ∫ dx / ((x − ${a})(x − ${p(b)})).`,s:[[`1/((x − ${a})(x − ${p(b)})) = A/(x − ${a}) + B/(x − ${p(b)})`,"Fatores lineares distintos: decomposição em frações parciais."],[`1 = A(x − ${p(b)}) + B(x − ${a})`,"Multiplicamos pelo denominador comum."],[`x = ${a} ⇒ A = 1/${D};  x = ${b} ⇒ B = −1/${D}`,"Substituímos as raízes para isolar A e B."],[`∫ = (1/${D})·(ln|x − ${a}| − ln|x − ${p(b)}|) + C`,"Integramos cada fração: ∫dx/(x − r) = ln|x − r|."],[`∫ = (1/${D})·ln|(x − ${a})/(x − ${p(b)})| + C`,"Propriedade do logaritmo do quociente."]],a:`(1/${D})·ln|(x − ${a})/(x − ${p(b)})| + C`}}},
{t:2,n:"Integrais de produtos de seno e cosseno",r:"Use as identidades produto-soma: sen A·cos B = ½[sen(A+B) + sen(A−B)], sen A·sen B = ½[cos(A−B) − cos(A+B)], cos A·cos B = ½[cos(A−B) + cos(A+B)].",

document.addEventListener("change",e=>{const t=e.target;if(t.id==="gal"&&t.files[0]){const i=$("#pv");i.src=URL.createObjectURL(t.files[0]);i.hidden=false;prep(t.files[0]).then(b=>{imgB=b});$("#cm").textContent=""}else if(t.id==="pf")setPhoto(t.files[0])});
let imgB=null;
const PROMPT="Você é um professor universitário de Física (mecânica clássica), Geometria Analítica e Cálculo. A imagem contém uma ou mais questões. Identifique TODAS as questões, na ordem em que aparecem. Responda cada uma separadamente: comece com uma linha '## Questão N' (N = número ou ordem na imagem), depois a resolução passo a passo, clara, em português do Brasil, terminando com 'Resposta final: ...'. Se a imagem trouxer uma resolução escrita pelo aluno, resolva a questão mesmo assim e, no fim, diga se a resolução do aluno está correta e onde errou. Se algo estiver ilegível, diga exatamente o quê em vez de inventar. Não use outra formatação markdown além dos títulos '## '; escreva fórmulas em texto simples com símbolos Unicode.";
const rsHTML=t=>t.split(/^##\s*/m).filter(s=>s.trim()).map(s=>{const l=s.split("\n"),h=l.shift();return`<div class="panel"><h3 class="gt">${esc(h.trim())}</h3><p>${esc(l.join("\n").trim()).replace(/\n/g,"<br>")}</p></div>`}).join("");
const prep=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>r(b||f),"image/jpeg",.88)};im.onerror=()=>r(f);im.src=URL.createObjectURL(f)});
async function enviar(){const m=$("#cm"),o=$("#rs"),bt=$("#snd");if(!imgB){m.textContent="Anexe ou tire uma foto primeiro.";return}
let sm=null;try{sm=window.claude&&claude.use?await claude.use("sample"):null}catch(e){}
if(!sm){m.textContent="A correção por IA não está disponível aqui. Abra a página pelo claude.ai, logado na sua conta.";return}
let lim={};try{lim=await sm.limits()}catch(e){}
if(!lim.images){m.textContent="O envio de imagens para a IA não está disponível no momento.";return}
bt.disabled=true;o.innerHTML="";m.textContent="Analisando…";
try{await sm(PROMPT,{images:[imgB],modelTier:"complex",cache:false,onText:({text})=>{o.innerHTML=rsHTML(text)}});m.textContent=""}
catch(e){m.textContent=e&&e.code==="not_granted"?"Permissão negada. Autorize o uso da IA para receber a correção.":e&&e.code==="rate_limited"?"Muitos pedidos seguidos. Aguarde um pouco e tente de novo.":"Não foi possível corrigir agora. Tente novamente."}
bt.disabled=false}
sbMark();
const rk=T.findIndex(x=>x.n===DB.cur);if(rk>=0)tab=T[rk].t;
home();if(rk>=0)open(rk);
</script>
</body>
